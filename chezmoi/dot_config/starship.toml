"$schema" = 'https://starship.rs/config-schema.json'

# Keep the prompt compact while showing directory, Git and active runtimes.
add_newline = true
format = "$directory$git_branch$git_status$python$nodejs$golang$cmd_duration$line_break$character"

[directory]
truncation_length = 3
truncate_to_repo = false

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[cmd_duration]
min_time = 2000
